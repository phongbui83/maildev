apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: maildev-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: maildev-postgres
  template:
    metadata:
      labels:
        app: maildev-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_USER
              value: maildev
            - name: POSTGRES_DB
              value: maildev
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maildev-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: TZ
              value: Asia/Ho_Chi_Minh
          ports:
            - containerPort: 5432
              name: pg
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "maildev", "-d", "maildev"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "maildev", "-d", "maildev"]
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nas80-nfs
        resources:
          requests:
            storage: 20Gi
