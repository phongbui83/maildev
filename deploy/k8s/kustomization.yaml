apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maildev

resources:
- namespace.yaml
- configmap.yaml
- certificate.yaml
- api.yaml
- web.yaml
- httproute.yaml

# Secrets are created out of band (see make-secrets.sh) so nothing sensitive is committed:
#   maildev-secrets  (MAILDEV_DATABASE_URL -> external PostgreSQL db.example.com, MAILDEV_MASTER_KEY)
#   The database runs outside the cluster; postgres.optional.yaml is an in-cluster alternative.
#   ad-ca            (ca.crt: pinned certificate of dc01.example.com or the AD CA root)

images:
- name: ghcr.io/phongbui83/maildev/api
  newTag: "202610291355"
- name: ghcr.io/phongbui83/maildev/web
  newTag: "202610291355"
